<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Dice Color</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="rain-canvas"></canvas>
<canvas id="bg-light-canvas"></canvas>
<div id="flash-overlay"></div>

<button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ FULLSCREEN</button>

<div class="container">
  <div class="app-title">Live Dice Color</div>
  <div class="stars">★ ★ ★ ★ ★</div>

  <div class="main-card">

    <!-- CONTROLS: 3 kolom -->
    <div class="controls-row">
      <div class="control-group">
        <div class="control-label"><span>⚄</span> JUMLAH WARNA</div>
        <select class="styled-select" id="numDiceSelect" onchange="updateNumDice()">
          <option value="1">1 WARNA</option>
          <option value="2" selected>2 WARNA</option>
          <option value="3">3 WARNA</option>
          <option value="4">4 WARNA</option>
        </select>
      </div>
      <div class="control-group">
        <div class="control-label"><span>🎨</span> MODE</div>
        <select class="styled-select" id="modeSelect">
          <option value="warna">DADU WARNA</option>
        </select>
      </div>
      <div class="control-group">
        <div class="control-label"><span>🔊</span> SOUND</div>
        <select class="styled-select" id="soundSelect" onchange="onSoundChange()">
          <option value="duar">Thunder</option>
          <option value="classic">Classic</option>
          <option value="magic">Magic</option>
          <option value="none">None / Off</option>
        </select>
      </div>
    </div>

    <!-- DICE AREA -->
    <div class="dice-area">
      <div class="dice-container" id="diceContainer">
        <div class="dice-placeholder">Tekan SPIN untuk mulai!</div>
      </div>
    </div>

    <!-- ROLLING TEXT -->
    <div class="rolling-text" id="rollingText">Mengocok Warna...</div>

    <!-- RESULT BAR -->
    <div class="result-bar" id="resultBar"></div>

    <!-- ROLL BUTTON -->
    <button class="roll-btn" id="rollBtn" onclick="rollDice()">
      <span class="btn-icon">🎲</span> SPIN LAGI!
    </button>

    <!-- COLOR INFO -->
    <div class="color-info">
      Possible colors are:
      <span class="ci-red">Red</span>,
      <span class="ci-orange">Orange</span>,
      <span class="ci-yellow">Yellow</span>,
      <span class="ci-green">Green</span>,
      <span class="ci-blue">Blue</span> and
      <span class="ci-purple">Purple</span>.
    </div>

    <!-- STATUS BAR -->
    <div class="status-bar">
      <div class="connection-badge" id="connectionBadge">
        <div class="status-dot"></div>
        <span id="connectionText">Menghubungkan...</span>
      </div>
    </div>

  </div><!-- end main-card -->

  <!-- DOWNLOAD (bawah border) -->
  <div class="download-section">
    <a href="/download.html" class="btn-download">⬇ DOWNLOAD APP</a>
  </div>

</div><!-- end container -->

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>

<!-- Rain + BG Lightning -->
<script>
(function(){
  // --- RAIN ---
  const rC = document.getElementById('rain-canvas');
  const rX = rC.getContext('2d');
  let drops = [];
  function initRain(){
    rC.width = window.innerWidth; rC.height = window.innerHeight; drops = [];
    for(let i=0;i<160;i++) drops.push({
      x: Math.random()*rC.width, y: Math.random()*rC.height,
      len: 14+Math.random()*26, speed: 5+Math.random()*9,
      op: 0.08+Math.random()*0.32, w: 0.5+Math.random()*1.2
    });
  }
  function animRain(){
    rX.clearRect(0,0,rC.width,rC.height);
    drops.forEach(d=>{
      rX.beginPath(); rX.strokeStyle=`rgba(140,200,255,${d.op})`; rX.lineWidth=d.w;
      rX.moveTo(d.x,d.y); rX.lineTo(d.x-1.5,d.y+d.len); rX.stroke();
      d.y+=d.speed;
      if(d.y>rC.height+40){d.y=-d.len-10;d.x=Math.random()*rC.width;}
    });
    requestAnimationFrame(animRain);
  }
  initRain(); animRain(); window.addEventListener('resize',initRain);

  // --- BG LIGHTNING (ambient kecil) ---
  const bgC = document.getElementById('bg-light-canvas');
  const bgX = bgC.getContext('2d');
  bgC.width=window.innerWidth; bgC.height=window.innerHeight;
  let bgTimer=0;
  function animBg(){
    bgX.clearRect(0,0,bgC.width,bgC.height);
    bgTimer--;
    if(bgTimer<=0&&Math.random()<0.015){bgTimer=40+Math.random()*80;drawSmallBolt();}
    requestAnimationFrame(animBg);
  }
  function drawSmallBolt(){
    const x=50+Math.random()*(bgC.width-100), segs=8+Math.floor(Math.random()*6), h=150+Math.random()*250;
    let cx=x, cy=0;
    bgX.shadowBlur=12; bgX.shadowColor='rgba(180,220,255,0.8)';
    bgX.strokeStyle='rgba(200,230,255,0.6)'; bgX.lineWidth=1.5;
    bgX.beginPath(); bgX.moveTo(cx,cy);
    for(let i=0;i<segs;i++){cx+=(Math.random()-0.5)*50;cy+=h/segs;bgX.lineTo(cx,cy);}
    bgX.stroke();
    bgX.shadowBlur=20; bgX.strokeStyle='rgba(150,200,255,0.2)'; bgX.lineWidth=4; bgX.stroke();
    setTimeout(()=>bgX.clearRect(0,0,bgC.width,bgC.height), 200+Math.random()*300);
  }
  animBg();
  window.addEventListener('resize',()=>{bgC.width=window.innerWidth;bgC.height=window.innerHeight;});

  // --- FLASH helper (dipanggil dari script.js override) ---
  window.triggerFlash = function(){
    const fl = document.getElementById('flash-overlay');
    fl.classList.add('flash');
    setTimeout(()=>fl.classList.remove('flash'),450);
  };

  // --- SOUND ---
  window.onSoundChange = function(){};
})();
</script>

</body>
</html>
