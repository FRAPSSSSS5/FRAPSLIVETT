<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Dice Color</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Extra dice area polish */
    .dice-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>
<body>

<button class="fullscreen-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">⛶ FULLSCREEN</button>

<div class="container">
  <div class="main-card">

    <!-- TITLE -->
    <div class="title-section">
      <div class="game-title">Live Dice Color</div>
      <div class="title-stars">★ ★ ★ ★ ★</div>
    </div>

    <!-- CONTROLS -->
    <div class="controls-row">
      <div class="select-wrapper">
        <label>⚄ JUMLAH WARNA</label>
        <select class="styled-select" id="numDiceSelect" onchange="updateNumDice()">
          <option value="1">1 WARNA</option>
          <option value="2" selected>2 WARNA</option>
          <option value="3">3 WARNA</option>
          <option value="4">4 WARNA</option>
        </select>
      </div>
      <div class="select-wrapper">
        <label>🎨 MODE</label>
        <select class="styled-select" id="modeSelect">
          <option value="warna">DADU WARNA</option>
        </select>
      </div>
    </div>

    <!-- DICE AREA -->
    <div class="dice-area" id="diceArea">
      <div class="dice-container" id="diceContainer">
        <div class="dice-placeholder">Tekan SPIN untuk mulai!</div>
      </div>
    </div>

    <div class="rolling-text" id="rollingText"> Mengocok Warna... </div>

    <!-- ROLL BUTTON -->
    <button class="roll-btn" id="rollBtn" onclick="rollDice()">
      <span class="btn-icon"></span> SPIN LAGI!
    </button>

    <!-- COLOR INFO -->
    <div class="color-info">
      Warna yang mungkin adalah:
      <span class="color-name c-merah">Merah</span>,
      <span class="color-name c-oranye">Oranye</span>,
      <span class="color-name c-kuning">Kuning</span>,
      <span class="color-name c-hijau">Hijau</span>,
      <span class="color-name c-biru">Biru</span>, dan
      <span class="color-name c-ungu">Ungu</span>.
    </div>

    <!-- STATUS BAR -->
    <div class="status-bar">
      <div class="connection-badge" id="connectionBadge">
        <div class="status-dot"></div>
        <span id="connectionText">Menghubungkan...</span>
      </div>
    </div>

  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>

<!-- Rainbow Cursor Trail -->
<canvas id="rbTrailCanvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;"></canvas>
<script>
(function() {
  const cvs = document.getElementById('rbTrailCanvas');
  const ctx = cvs.getContext('2d');
  let W, H;

  function resize() {
    W = cvs.width = window.innerWidth;
    H = cvs.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const particles = [];
  let hue = 0;
  let mx = W / 2, my = H / 2;
  let px = mx, py = my;

  document.addEventListener('mousemove', (e) => {
    px = mx; py = my;
    mx = e.clientX;
    my = e.clientY;
    const speed = Math.hypot(mx - px, my - py);
    const count = Math.max(2, Math.floor(speed / 4));
    for (let i = 0; i < count; i++) {
      const t = i / count;
      particles.push({
        x: px + (mx - px) * t,
        y: py + (my - py) * t,
        hue: hue,
        r: Math.min(28, 8 + speed * 0.4),
        alpha: 0.85,
        vx: (Math.random() - 0.5) * 0.6,
        vy: (Math.random() - 0.5) * 0.6,
        life: 1
      });
      hue = (hue + 2) % 360;
    }
  });

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= 0.018;
      p.x += p.vx;
      p.y += p.vy;
      p.r *= 0.995;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      grad.addColorStop(0, `hsla(${p.hue},100%,70%,${p.life * p.alpha})`);
      grad.addColorStop(0.5, `hsla(${p.hue},100%,55%,${p.life * p.alpha * 0.6})`);
      grad.addColorStop(1, `hsla(${p.hue},100%,40%,0)`);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    }
    hue = (hue + 0.3) % 360;
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

</body>
</html>
